<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320" role="img" aria-labelledby="title">
  <title id="title">GO NOW radar button</title>
  <defs>
    <radialGradient id="core" cx="50%" cy="50%"><stop offset="0" stop-color="#fff7df"/><stop offset=".22" stop-color="#ffbd5e"/><stop offset="1" stop-color="#ff6b24" stop-opacity="0"/></radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="text-pop" x="-40%" y="-50%" width="180%" height="200%">
      <feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#872400" flood-opacity=".80"/>
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#ff9a52" flood-opacity=".82"/>
    </filter>
  </defs>
  <g fill="none" stroke="#ff6b24" stroke-linecap="round">
    <circle cx="160" cy="160" r="128" opacity=".42" stroke-width="3"/><circle cx="160" cy="160" r="94" opacity=".60" stroke-width="3"/><circle cx="160" cy="160" r="64" opacity=".78" stroke-width="3"/>
    <path d="M160 12v30M308 160h-30M160 308v-30M12 160h30" stroke-width="4"/>
  </g>
  <circle cx="160" cy="160" r="53" fill="url(#core)" filter="url(#glow)" opacity=".96"/>
  <circle cx="160" cy="160" r="45" fill="#f25a17"/>
  <g text-anchor="middle" fill="#fffdf8" stroke="#8b2908" stroke-width="1.6" paint-order="stroke fill" font-family="Arial Black, Arial, sans-serif" font-weight="900" filter="url(#text-pop)">
    <text x="160" y="156" font-size="38" letter-spacing="1">GO</text>
    <text x="160" y="188" font-size="30" letter-spacing=".2">NOW</text>
  </g>
</svg>
